name: Live golden cases

# G1–G3b against the production rftools.io API through the plugin's own client
# (scripts/live_golden.py, rftools_kicad/client.py): weekly, before each release
# is published (release.yml calls this workflow), and on demand. It runs on
# Python 3.9, the oldest interpreter the plugin supports (KiCad's on macOS).
#
# Cost: at most 4 metered API calls per run — G1 one solve, and one forward
# call each for G2, G3 and G3b (trace-width-current's board-specific width,
# openspec trace-thermal-model). Reading the allowance first is free. Nothing
# is cached between runs.
#
# Needs the repository secret RFTOOLS_API_KEY: a free key created through
# https://rftools.io/dashboard/?newKey=1&client=kicad-plugin (task 5.4, with
# the founder's approval). Without it the job reports a notice and passes.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
  workflow_call:
    secrets:
      RFTOOLS_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  live:
    name: G1–G3b against production
    runs-on: ubuntu-24.04  # pinned 2026-10-06: ubuntu-latest becomes Ubuntu 26 on 2026-10-19; move deliberately
    env:
      RFTOOLS_API_KEY: ${{ secrets.RFTOOLS_API_KEY }}
    steps:
      - name: Is the key set?
        id: key
        run: |
          if [ -z "$RFTOOLS_API_KEY" ]; then
            echo "::notice title=Live golden check skipped::The RFTOOLS_API_KEY secret is not set, so G1–G3b were not run against the production API. Add it under Settings > Secrets and variables > Actions to run them."
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.set == 'true'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.set == 'true'
        with:
          python-version: "3.9"
      - name: Install what the plugin declares
        if: steps.key.outputs.set == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: -r plugins/requirements.txt
      - name: G1 solve, G2, G3 and G3b forward (4 calls at most)
        if: steps.key.outputs.set == 'true'
        run: python scripts/live_golden.py
